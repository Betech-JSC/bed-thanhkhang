# Nginx Configuration: Redirect www.hhmaker.vn to https://hhmaker.vn (301 Permanent Redirect)
# Place this configuration block on the VPS (e.g. /etc/nginx/sites-available/hhmaker-redirect-www.conf)
# and link to /etc/nginx/sites-enabled/

server {
    listen 80;
    listen [::]:80;
    server_name www.hhmaker.vn;

    # Redirect all HTTP requests from www to HTTPS non-www
    return 301 https://hhmaker.vn$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.hhmaker.vn;

    # SSL Certificate (use same certbot certificate or wild-card/SAN cert)
    ssl_certificate /etc/letsencrypt/live/hhmaker.vn/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/hhmaker.vn/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # Redirect all HTTPS requests from www to HTTPS non-www
    return 301 https://hhmaker.vn$request_uri;
}
